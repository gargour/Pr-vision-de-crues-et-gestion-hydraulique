name: Collecte planifiée

on:
  schedule:
    - cron: "0 5 * * 1"        # chaque lundi à 05:00 UTC
  workflow_dispatch:            # lancement manuel possible

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation
        run: pip install -r requirements.txt

      - name: Collecte et validation (échantillon 2024)
        run: |
          for e in hubeau clean_hubeau plot_hubeau sentinel2_catalog analyse_catalogue validation sentinel1_catalog; do
            python -m src.pipeline --config configs/ci.yaml --seulement $e || exit 1
          done

      - name: Conserver les rapports et le journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collecte-rapports
          path: |
            reports_ci/
            logs/
          retention-days: 30