name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation
        run: pip install -r requirements.txt

      - name: Lint (erreurs graves)
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 src tests scripts

      - name: Tests unitaires
        run: python -m pytest -v

      - name: Définition du pipeline DVC
        run: dvc dag

      - name: Pipeline sur échantillon (2024)
        run: |
          for e in hubeau clean_hubeau plot_hubeau sentinel2_catalog analyse_catalogue validation sentinel1_catalog; do
            python -m src.pipeline --config configs/ci.yaml --seulement $e || exit 1
          done