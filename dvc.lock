            hubeau: Données publiques Hub'Eau (licence à confirmer sur 
              hubeau.eaufrance.fr)
            sentinel: Données Copernicus Sentinel, accès libre et gratuit 
              (conditions à confirmer sur dataspace.copernicus.eu)
          biais:
          - Une seule station et une seule zone d'étude.
          - Les images optiques sont rares pendant les crues (nuages) ; le radar
            comble ce manque.
          - 'Les jours de crue sont des jours, pas des événements : une même crue
            compte plusieurs fois.'
          - Les valeurs de débit de qualité douteuse sont concentrées en étiage.
          - La zone est à cheval sur deux tuiles Sentinel-2 ; on en garde une 
            par date.
          - Les images nettoyées ne couvrent que certaines années (voir 
            images_nettoyees.annees).
        images_nettoyees:
          annees:
          - 2018
          bandes:
          - B02
          - B03
          - B04
          - B08
          scl_mauvais:
          - 0
          - 1
          - 3
          - 8
          - 9
          - 10
          - 11
        nettoyage:
          interpolation_max_jours: 3
          max_manquants_pct: 5
        station:
          code_site: H0203020
          code_station: H020302002
          longitude: 4.361
          latitude: 47.96178
        utilisable:
          couverture_min_pct: 50
          nuages_max_pct: 20
          ombres_max_pct: 5
          neige_max_pct: 5
        zone:
          bbox:
